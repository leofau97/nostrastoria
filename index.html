<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo e Ale — Capitolo 1</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a0a00;
    --paper: #f5ead6;
    --accent: #c0392b;
    --gold: #d4a017;
  }

  body {
    background: #1a0a00;
    font-family: 'Lora', serif;
    overflow-x: hidden;
  }

  #intro {
    position: fixed; inset: 0;
    background: var(--ink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  #intro h1 {
    font-family: 'Bangers', cursive;
    font-size: clamp(4rem, 12vw, 9rem);
    color: var(--paper);
    letter-spacing: 4px;
    text-shadow: 6px 6px 0 var(--accent);
    animation: pulse 2s infinite;
  }
  #intro p {
    color: var(--gold);
    font-style: italic;
    font-size: 1.2rem;
    margin-top: 1rem;
    opacity: 0.8;
  }
  #start-btn {
    margin-top: 2.5rem;
    padding: 1rem 3rem;
    font-family: 'Bangers', cursive;
    font-size: 1.8rem;
    letter-spacing: 3px;
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    clip-path: polygon(4% 0%, 96% 0%, 100% 50%, 96% 100%, 4% 100%, 0% 50%);
    transition: transform 0.2s, background 0.2s;
    animation: bounce 1.5s infinite;
  }
  #start-btn:hover { transform: scale(1.1); background: #e74c3c; }

  @keyframes pulse {
    0%, 100% { text-shadow: 6px 6px 0 var(--accent); }
    50% { text-shadow: 8px 8px 0 var(--accent), 0 0 30px rgba(192,57,43,0.5); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  #reader {
    display: none;
    min-height: 100vh;
    background: var(--ink);
    padding: 2rem 1rem 6rem;
  }
  #reader.visible { display: block; }

  .comic-container { max-width: 700px; margin: 0 auto; }

  .flip-container { perspective: 1500px; }

  .page-wrapper {
    width: 100%;
    transform-style: preserve-3d;
  }
  .page-wrapper.flip-left {
    animation: flipLeft 0.6s ease-in-out forwards;
  }
  .page-wrapper.flip-right {
    animation: flipRight 0.6s ease-in-out forwards;
  }

  @keyframes flipLeft {
    0%   { transform: rotateY(0deg); opacity: 1; }
    45%  { transform: rotateY(-90deg); opacity: 0.2; }
    55%  { transform: rotateY(90deg); opacity: 0.2; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }
  @keyframes flipRight {
    0%   { transform: rotateY(0deg); opacity: 1; }
    45%  { transform: rotateY(90deg); opacity: 0.2; }
    55%  { transform: rotateY(-90deg); opacity: 0.2; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }

  .page-inner {
    background: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--accent), 12px 12px 0 var(--ink);
    position: relative;
    overflow: hidden;
  }
  .page-inner img { width: 100%; display: block; }

  .page-badge {
    position: absolute;
    top: 12px; right: 12px;
    background: var(--accent);
    color: white;
    font-family: 'Bangers', cursive;
    font-size: 1rem;
    letter-spacing: 1px;
    padding: 2px 10px;
    z-index: 2;
    clip-path: polygon(6% 0%, 94% 0%, 100% 50%, 94% 100%, 6% 100%, 0% 50%);
  }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }
  .nav-btn {
    font-family: 'Bangers', cursive;
    font-size: 1.4rem;
    letter-spacing: 2px;
    padding: 0.7rem 2rem;
    border: 3px solid var(--paper);
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(6% 0%, 94% 0%, 100% 50%, 94% 100%, 6% 100%, 0% 50%);
  }
  .nav-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); transform: scale(1.05); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .page-counter {
    font-family: 'Bangers', cursive;
    font-size: 1.5rem;
    color: var(--gold);
    letter-spacing: 2px;
    min-width: 80px;
    text-align: center;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #444;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active { background: var(--accent); transform: scale(1.4); }
  .dot:hover { background: var(--gold); }

  /* Music player */
  .music-bar {
    position: fixed;
    bottom: 1.5rem; right: 1.5rem;
    display: none;
    align-items: center;
    gap: 0.8rem;
    background: rgba(26,10,0,0.93);
    border: 2px solid var(--gold);
    padding: 0.6rem 1.2rem;
    z-index: 50;
    backdrop-filter: blur(8px);
  }
  .music-bar.visible { display: flex; }
  .music-btn {
    background: none; border: none;
    color: var(--gold);
    font-size: 1.5rem;
    cursor: pointer;
    transition: transform 0.2s;
    line-height: 1;
  }
  .music-btn:hover { transform: scale(1.2); }
  .music-label {
    color: var(--paper);
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 0.75rem;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .music-note {
    color: var(--accent);
    animation: noteBounce 1s infinite;
    font-size: 1rem;
  }
  @keyframes noteBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .final-message {
    text-align: center;
    padding: 3rem 2rem;
    background: var(--ink);
    max-width: 700px;
    margin: 2rem auto 0;
    border: 3px solid var(--gold);
    display: none;
  }
  .final-message.visible { display: block; animation: fadeIn 1s ease; }
  .final-message p { color: var(--paper); font-style: italic; font-size: 1.2rem; line-height: 1.8; }
  .heart-anim { font-size: 3rem; animation: heartbeat 1s infinite; display: block; margin-bottom: 1rem; }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .nav-btn { font-size: 1.1rem; padding: 0.6rem 1.4rem; }
    #intro h1 { font-size: 3.5rem; }
    .music-bar { bottom: 1rem; right: 1rem; }
    .music-label { max-width: 100px; }
  }
</style>
</head>
<body>

<div id="intro">
  <h1>Leo e Ale</h1>
  <p>Capitolo 1 — La nostra storia</p>
  <button id="start-btn" onclick="startReading()">LEGGI ❤️</button>
</div>

<div id="reader">
  <div class="comic-container">
    <div class="flip-container">
      <div class="page-wrapper" id="page-wrapper">
        <div class="page-inner">
          <div class="page-badge" id="page-badge" style="display:none;"></div>
          <img id="comic-img" src="1.PNG" alt="Copertina">
        </div>
      </div>
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn" onclick="changePage(-1)" disabled>◀ INDIETRO</button>
      <span class="page-counter" id="counter">1 / 17</span>
      <button class="nav-btn" id="next-btn" onclick="changePage(1)">AVANTI ▶</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

  <div class="final-message" id="final">
    <span class="heart-anim">❤️</span>
    <p>Fine Capitolo 1...<br>ma la storia continua. 🥰</p>
  </div>
</div>

<div class="music-bar" id="music-bar">
  <span class="music-note" id="music-note">♪</span>
  <span class="music-label">The Man Who Can't Be Moved</span>
  <button class="music-btn" id="music-btn" onclick="toggleMusic()">⏸</button>
</div>

<audio id="audio" loop>
  <source src="The Script - The Man Who Can't Be Moved (Official Video).mp3" type="audio/mpeg">
</audio>

<script>
  const TOTAL = 17;
  let current = 1;
  let isAnimating = false;

  // Build dots
  const dotsEl = document.getElementById('dots');
  for (let i = 1; i <= TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 1 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  }

  function startReading() {
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('reader').classList.add('visible');
    window.scrollTo(0, 0);

    const audio = document.getElementById('audio');
    audio.volume = 0.5;
    audio.play().catch(() => {});
    document.getElementById('music-bar').classList.add('visible');
  }

  function toggleMusic() {
    const audio = document.getElementById('audio');
    const btn = document.getElementById('music-btn');
    const note = document.getElementById('music-note');
    if (audio.paused) {
      audio.play();
      btn.textContent = '⏸';
      note.style.animationPlayState = 'running';
    } else {
      audio.pause();
      btn.textContent = '▶';
      note.style.animationPlayState = 'paused';
    }
  }

  function goTo(n, dir) {
    if (isAnimating || n === current) return;
    isAnimating = true;

    const direction = dir !== undefined ? dir : (n > current ? 1 : -1);
    const wrapper = document.getElementById('page-wrapper');
    const animClass = direction > 0 ? 'flip-left' : 'flip-right';

    wrapper.classList.add(animClass);

    setTimeout(() => {
      current = n;
      document.getElementById('comic-img').src = current + '.PNG';
      const badge = document.getElementById('page-badge');
      if (current === 1) {
        badge.style.display = 'none';
      } else {
        badge.style.display = 'block';
        badge.textContent = current + ' / ' + TOTAL;
      }
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current - 1));
      document.getElementById('counter').textContent = current + ' / ' + TOTAL;
      document.getElementById('prev-btn').disabled = current === 1;
      document.getElementById('next-btn').disabled = current === TOTAL;
      document.getElementById('final').classList.toggle('visible', current === TOTAL);
    }, 300);

    wrapper.addEventListener('animationend', () => {
      wrapper.classList.remove(animClass);
      isAnimating = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, { once: true });
  }

  function changePage(dir) {
    const next = current + dir;
    if (next >= 1 && next <= TOTAL) goTo(next, dir);
  }

  // Swipe
  let startX = 0;
  document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  document.addEventListener('touchend', e => {
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) changePage(diff > 0 ? 1 : -1);
  });

  // Arrow keys
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') changePage(1);
    if (e.key === 'ArrowLeft') changePage(-1);
  });
</script>
</body>
</html>
